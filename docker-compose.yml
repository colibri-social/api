services:
  appview:
    image: ${IMAGE:-ghcr.io/colibri-social/api:stable}
    build: .
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-file:/data/colibri.db}
      BLOB_DISK_CACHE_DIR: /data/blob-cache
    ports:
      - "40000-40031:40000-40031/udp"
      - "40000-40031:40000-40031/tcp"
    volumes:
      - appview-data:/data
    mem_limit: ${APPVIEW_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  updater:
    image: docker:27-cli
    profiles: [updater]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/stack/deploy/updater/update.sh"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-colibri}
      UPDATE_INTERVAL_SECONDS: ${UPDATE_INTERVAL_SECONDS:-21600}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/stack:ro

volumes:
  appview-data:
