services:
  appview:
    build: .
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-file:/data/colibri.db}
    ports:
      - "40000-40031:40000-40031/udp"
      - "40000-40031:40000-40031/tcp"
    volumes:
      - appview-data:/data
    mem_limit: ${APPVIEW_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  appview-data:
