services:
  appview:
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-dokploy-network}
      traefik.http.routers.colibri.rule: Host(`${PUBLIC_HOST:?set PUBLIC_HOST}`)
      traefik.http.routers.colibri.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.colibri.tls: "true"
      traefik.http.routers.colibri.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.colibri.service: colibri
      traefik.http.routers.colibri-api.rule: Host(`${API_HOST:-${PUBLIC_HOST}}`)
      traefik.http.routers.colibri-api.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.colibri-api.tls: "true"
      traefik.http.routers.colibri-api.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.colibri-api.service: colibri
      traefik.http.services.colibri.loadbalancer.server.port: "3000"

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-dokploy-network}
    external: true
