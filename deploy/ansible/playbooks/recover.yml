- name: Bring a node's stack back up
  hosts: all
  become: true
  gather_facts: false
  vars:
    stack_dir: /opt/colibri
  tasks:
    - name: Start every service
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ stack_dir }}"
      changed_when: true

    - name: Restart the AppView
      ansible.builtin.command: docker compose restart appview
      args:
        chdir: "{{ stack_dir }}"
      changed_when: true
