- name: Bootstrap a Colibri node
  hosts: all
  become: true
  gather_facts: true
  vars:
    stack_dir: /opt/colibri
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, ufw]
        update_cache: true

    - name: Install Docker
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Install Tailscale
      ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale

    - name: Join the tailnet
      ansible.builtin.command: >-
        tailscale up --authkey={{ tailscale_auth_key }} --hostname={{ node_id }} --ssh=false
      register: tailscale_up
      changed_when: tailscale_up.rc == 0
      no_log: true

    - name: Read the tailnet address
      ansible.builtin.command: tailscale ip -4
      register: tailnet_ip
      changed_when: false

    - name: Firewall defaults
      ansible.builtin.shell: |
        ufw default deny incoming
        ufw default allow outgoing
        ufw allow 22/tcp
        ufw allow 80/tcp
        ufw allow 443/tcp
        ufw allow 443/udp
        ufw allow in on tailscale0
      changed_when: true

    - name: Open the SFU ports
      ansible.builtin.shell: |
        ufw allow {{ rtc_port }}:{{ (rtc_port | int) + (rtc_workers | int) - 1 }}/udp
        ufw allow {{ rtc_port }}:{{ (rtc_port | int) + (rtc_workers | int) - 1 }}/tcp
      when: "'voice' in node_roles"
      changed_when: true

    - name: Turn on the firewall
      ansible.builtin.command: ufw --force enable
      changed_when: true

    - name: Create the stack directory
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: directory
        mode: "0750"

    - name: Write the stack
      ansible.builtin.template:
        src: "../templates/{{ item.src }}"
        dest: "{{ stack_dir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: compose.yml.j2, dest: docker-compose.yml, mode: "0640" }
        - { src: env.j2, dest: .env, mode: "0600" }
        - { src: Caddyfile.j2, dest: Caddyfile, mode: "0644" }
      no_log: true

    - name: Create the Caddy sites directory
      ansible.builtin.file:
        path: "{{ stack_dir }}/caddy-sites"
        state: directory
        mode: "0755"

    - name: Write the replica entrypoint
      ansible.builtin.copy:
        src: ../templates/replica-entrypoint.sh
        dest: "{{ stack_dir }}/replica-entrypoint.sh"
        mode: "0755"
      when: postgres | bool

    - name: Create the backup key directory
      ansible.builtin.file:
        path: "{{ stack_dir }}/backup"
        state: directory
        mode: "0700"
      when: postgres | bool

    - name: Write the backup SSH key
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ stack_dir }}/backup/{{ item.name }}"
        mode: "{{ item.mode }}"
      loop:
        - { name: key, content: "{{ backup_key | default('') }}", mode: "0600" }
        - { name: key.pub, content: "{{ backup_public_key | default('') }}", mode: "0644" }
      when: backup_repo_host is defined
      no_log: true

    - name: Copy the backup scripts
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ stack_dir }}/{{ item.dest }}"
        mode: "0755"
      loop:
        - { src: ../../postgres/backup.sh, dest: backup.sh }
        - { src: ../../observability/pgbackrest-age.sh, dest: pgbackrest-age.sh }
      when: backup_repo_host is defined

    - name: Schedule backups and the backup age check
      ansible.builtin.copy:
        dest: /etc/cron.d/colibri-backup
        mode: "0644"
        content: |
          SHELL=/bin/sh
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          30 2 * * * root STACK_DIR={{ stack_dir }} DB_USER={{ db_user }} {{ stack_dir }}/backup.sh >> /var/log/colibri-backup.log 2>&1
          */15 * * * * root cd {{ stack_dir }} && PGBACKREST_CMD="docker compose exec -T -u postgres postgres pgbackrest" {{ stack_dir }}/pgbackrest-age.sh >/dev/null 2>&1
      when: backup_repo_host is defined

    - name: Log in to the registry
      ansible.builtin.shell: echo "{{ registry_token }}" | docker login ghcr.io -u "{{ registry_user }}" --password-stdin
      when: registry_token is defined and registry_token
      no_log: true
      changed_when: true

    - name: Start the stack
      ansible.builtin.command: docker compose up -d --pull always
      args:
        chdir: "{{ stack_dir }}"
      changed_when: true
