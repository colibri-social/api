- name: Rebuild a node's Postgres as a replica of the current primary
  hosts: all
  become: true
  gather_facts: false
  vars:
    stack_dir: /opt/colibri
    detach: false
  tasks:
    - name: Point the replica at the primary hosts
      ansible.builtin.lineinfile:
        path: "{{ stack_dir }}/.env"
        regexp: "^PRIMARY_HOST="
        line: "PRIMARY_HOST={{ primary_hosts }}"

    - name: Write the rebuild script
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/rejoin-replica.sh"
        mode: "0700"
        content: |
          #!/bin/sh
          set -eu
          cd "{{ stack_dir }}"
          docker compose stop appview postgres
          docker compose rm -fsv postgres
          docker volume rm "$(basename "{{ stack_dir }}")_postgres-data" || true
          docker compose up -d

    - name: Rebuild now
      ansible.builtin.command: "{{ stack_dir }}/rejoin-replica.sh"
      changed_when: true
      when: not (detach | bool)

    - name: Rebuild after this run ends
      ansible.builtin.shell: nohup setsid sh -c 'sleep 5 && {{ stack_dir }}/rejoin-replica.sh' >/dev/null 2>&1 &
      changed_when: true
      when: detach | bool
