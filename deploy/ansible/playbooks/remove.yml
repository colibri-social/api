- name: Remove a retired node
  hosts: all
  become: true
  gather_facts: false
  vars:
    stack_dir: /opt/colibri
  tasks:
    - name: Stop and delete the stack and its volumes
      ansible.builtin.command: docker compose down -v
      args:
        chdir: "{{ stack_dir }}"
        removes: "{{ stack_dir }}/docker-compose.yml"
      changed_when: true

    - name: Delete the stack directory
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: absent

    - name: Leave the tailnet
      ansible.builtin.command: tailscale logout
      failed_when: false
      changed_when: true
