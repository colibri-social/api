[defaults]
inventory = localhost,
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent
forks = 1
timeout = 30

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/data/ssh/known_hosts
pipelining = True
