packages:
  - apps/*
  - packages/*

verifyDepsBeforeRun: warn

catalog:
  # atproto stuff is pinned to the alpha builds (same version for everything)
  "@atproto/api": 0.0.0-spaces-alpha-20260818163953
  "@atproto/common": 0.0.0-spaces-alpha-20260818163953
  "@atproto/crypto": 0.0.0-spaces-alpha-20260818163953
  "@atproto/identity": 0.0.0-spaces-alpha-20260818163953
  "@atproto/lex": 0.0.0-spaces-alpha-20260818163953
  "@atproto/lex-schema": 0.0.0-spaces-alpha-20260818163953
  "@atproto/oauth-scopes": 0.0.0-spaces-alpha-20260818163953
  "@atproto/space": 0.0.0-spaces-alpha-20260818163953
  "@atproto/syntax": 0.0.0-spaces-alpha-20260818163953
  "@atproto/xrpc": 0.0.0-spaces-alpha-20260818163953
  "@atproto/xrpc-server": 0.0.0-spaces-alpha-20260818163953

  # atproto packages with no spaces-alpha build
  "@atproto/jwk": ^0.7.4
  "@atproto/jwk-jose": ^0.2.4
  "@atproto/lex-cbor": ^0.1.6
  "@atproto/lex-data": ^0.1.7

  # storage
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  "@libsql/client": ^0.17.4
  pg: ^8.23.0
  "@types/pg": ^8.23.1

  # server
  hono: ^4.13.3
  ws: ^8.21.3
  "@types/ws": ^8.18.1
  undici: ^8.10.0

  # media
  mediasoup: ^3.26.0
  sharp: ^0.35.3
  file-type: ^22.0.2

  # push
  web-push: ^3.6.7
  "@types/web-push": ^3.6.4
  firebase-admin: ^14.3.0

  # observability
  "@sentry/node": ^10.70.0
  pino: ^10.3.1
  pino-pretty: ^13.1.3

  # shared
  zod: ^4.4.3
  lru-cache: ^11.5.2

  # tooling
  "@types/node": ^26.2.0
  typescript: 7.0.2
  vitest: ^4.1.11

allowBuilds:
  esbuild: true
  mediasoup: true
  sharp: true
  "@biomejs/biome": true
  "@libsql/client": true
  protobufjs: false
  "@sentry/cli": false

# Semver ranks `0.0.0` above `0.0.0-spaces-alpha-*` because of course it does
overrides:
  "@atproto/api": 0.0.0-spaces-alpha-20260818163953
