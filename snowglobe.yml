globe: colibri

pds:
  - name: alpha
    image: ghcr.io/bluesky-social/atproto:pds-spaces-alpha
    invites: required
    bare_handles: true

services:
  jetstream: true
  slingshot: true
  pdsls: true

lexicons:
  authority: alpha
  publish: packages/lexicons/lexicons/social

accounts:
  - alice@alpha
  - bob@alpha
  - charlie@alpha

apps:
  - name: appview
    local: { port: 3000 }
    env:
      APPVIEW_DID: did:web:${apps.appview.host}
      PUBLIC_URL: ${apps.appview.url}
      PDS_URL: ${pds.alpha.url}
      PLC_URL: ${services.plc.url}
      JETSTREAM_URL: wss://jetstream.${domain}
      COMMUNITY_HANDLE_DOMAIN: ${domain}
      CORS_ORIGINS: http://127.0.0.1:5173

  - name: bridge
    local: { port: 3100 }
    env:
      COLIBRI_APPVIEW_URL: ${apps.appview.url}
      COLIBRI_APPVIEW_DID: did:web:${apps.appview.host}
      BRIDGE_DID: did:web:${apps.bridge.host}
      BRIDGE_HTTP_PORT: "3100"
