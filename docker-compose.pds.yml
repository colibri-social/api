# Overlay adding a local spaces-alpha PDS and its own PLC directory, so nothing
# a development community mints reaches the public directory
#
#   docker compose -f docker-compose.yml -f docker-compose.pds.yml up
services:
  appview:
    environment:
      PDS_URL: http://pds:3001
      PLC_URL: http://plc:2582
      COMMUNITY_HANDLE_DOMAIN: test
      COMMUNITY_EMAIL_DOMAIN: communities.test.invalid
      JETSTREAM_ENABLED: "false"
    depends_on:
      pds:
        condition: service_healthy

  pds:
    image: ghcr.io/bluesky-social/atproto:pds-spaces-alpha
    platform: linux/amd64
    restart: unless-stopped
    environment:
      PDS_HOSTNAME: localhost
      PDS_PORT: "3001"
      PDS_DEV_MODE: "true"
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_JWT_SECRET: ${PDS_JWT_SECRET:-devsecretdevsecretdevsecretdev00}
      PDS_ADMIN_PASSWORD: ${PDS_ADMIN_PASSWORD:-admin}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_PLC_ROTATION_KEY}
      PDS_DID_PLC_URL: http://plc:2582
      PDS_INVITE_REQUIRED: "false"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - pds-data:/pds
    depends_on:
      plc:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/xrpc/_health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  plc:
    build: ./docker/plc
    restart: unless-stopped
    environment:
      PORT: "2582"
      DATABASE_URL: postgres://postgres:plc@plc-db:5432/postgres
    depends_on:
      plc-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:2582:2582"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2582/_health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

  plc-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: plc
    volumes:
      - plc-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pds-data:
  plc-data:
